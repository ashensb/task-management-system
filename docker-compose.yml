version: '3.8'

services:
  # MySQL Database Container
  mysql_db:
    image: mysql:8.0
    container_name: task_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@123456
      MYSQL_DATABASE: task_management_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Express Backend Container
  backend:
    build: ./backend
    container_name: task_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: Root@123456
      DB_NAME: task_management_db
      JWT_SECRET: my_super_secret_jwt_key
    depends_on:
      - mysql_db

  # React Frontend Container
  frontend:
    build: ./frontend
    container_name: task_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: